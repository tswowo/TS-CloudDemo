server:
  port: 8086

seata:
  tx-service-group: hmall
  service:
    vgroup-mapping:
      hmall: "default"
    grouplist:
      default: localhost:8091

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${hm.nacos.host}:${hm.nacos.port}

hm:
  es:
    uri: http://localhost:19200
  swagger:
    title: "黑马商城搜索管理接口文档"
    package: com.hmall.search.controller
